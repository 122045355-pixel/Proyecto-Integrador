global
    log stdout format raw local0
    maxconn 2000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:80
    acl is_api2 path_beg /api2

    use_backend api2_v4_backend if is_api2
    default_backend legal_api_backend

backend legal_api_backend
    balance roundrobin
    option httpchk GET /docs
    http-check expect status 200
    http-response set-header X-Backend-Server %[srv_name]
    server api_v4 api_v4:8000 check inter 5s rise 2 fall 3
    server api2_v4 api2_v4:8000 check inter 5s rise 2 fall 3

backend api2_v4_backend
    balance roundrobin
    option httpchk GET /docs
    http-check expect status 200
    http-response set-header X-Backend-Server %[srv_name]
    server api2_v4 api2_v4:8000 check inter 5s rise 2 fall 3
